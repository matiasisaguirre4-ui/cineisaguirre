<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#e50914">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Cine Isaguirre</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════
   RESET & VARIABLES
   ═══════════════════════════════════════════════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#141414;--bg-card:#1a1a1a;--bg-nav:rgba(20,20,20,0);--bg-nav-s:rgba(20,20,20,.97);
  --red:#e50914;--red-hover:#f6121d;--white:#e5e5e5;--white-b:#fff;--gray:#808080;
  --radius:8px;--shadow:0 8px 32px rgba(0,0,0,.45);--t:.3s cubic-bezier(.4,0,.2,1);
}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--white);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button{cursor:pointer;font-family:inherit}img{display:block;max-width:100%}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:#333;border-radius:4px}::-webkit-scrollbar-thumb:hover{background:#555}

/* ═══════════════════════════════════════════════════
   NAVBAR
   ═══════════════════════════════════════════════════ */
.navbar{position:fixed;top:0;left:0;right:0;z-index:1000;display:flex;align-items:center;gap:10px;padding:12px 4%;height:64px;background:var(--bg-nav);transition:background var(--t)}
.navbar.scrolled{background:var(--bg-nav-s);box-shadow:0 2px 20px rgba(0,0,0,.5)}
.logo{font-size:1.5rem;font-weight:900;letter-spacing:-.5px;color:var(--red);flex-shrink:0;text-transform:uppercase}
.logo span{color:var(--white-b);font-weight:300}
.nav-spacer{flex:1}

/* Stats badge */
.stats-badge{display:flex;align-items:center;gap:8px;padding:5px 14px;border-radius:20px;background:rgba(255,255,255,.07);font-size:.73rem;color:var(--gray);white-space:nowrap;border:1px solid rgba(255,255,255,.08)}
.stats-badge .stat-item{display:flex;align-items:center;gap:4px}
.stats-badge .stat-sep{color:#333}

/* Search */
.search-wrap{position:relative;display:flex;align-items:center}
.search-wrap input{width:0;padding:0;border:none;outline:none;background:transparent;color:var(--white-b);font-size:.88rem;transition:width .35s ease,padding .35s ease,background .35s ease;border-radius:var(--radius)}
.search-wrap.open input{width:210px;padding:8px 12px 8px 36px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2)}
.search-wrap .search-icon{position:absolute;left:8px;font-size:1rem;z-index:2;background:none;border:none;color:var(--white);transition:color var(--t)}
.search-wrap .search-icon:hover{color:var(--white-b)}

/* Nav buttons */
.nav-btn{background:none;border:1px solid rgba(255,255,255,.2);color:var(--white);padding:5px 12px;border-radius:var(--radius);font-size:.78rem;font-weight:500;transition:all var(--t);white-space:nowrap}
.nav-btn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.4)}
.nav-btn.active{background:var(--red);border-color:var(--red);color:#fff}

/* Sync button */
.btn-sync{display:inline-flex;align-items:center;gap:5px}
.btn-sync .sync-icon{display:inline-block;transition:transform .3s ease}
.btn-sync.syncing .sync-icon{animation:syncSpin 1s linear infinite}
@keyframes syncSpin{to{transform:rotate(360deg)}}

/* ═══════════════════════════════════════════════════
   HERO BANNER
   ═══════════════════════════════════════════════════ */
.hero{position:relative;width:100%;min-height:85vh;display:flex;align-items:flex-end;background-size:cover;background-position:center 20%;background-color:#0a0a0a;transition:background-image .6s ease}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(20,20,20,0) 0%,rgba(20,20,20,.15) 40%,rgba(20,20,20,.7) 70%,rgba(20,20,20,1) 100%)}
.hero-content{position:relative;z-index:2;padding:0 4% 6%;max-width:650px}
.hero-content h1{font-size:clamp(2rem,5vw,3.2rem);font-weight:800;line-height:1.1;color:var(--white-b);margin-bottom:14px;text-shadow:0 2px 20px rgba(0,0,0,.7)}
.hero-meta{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.hero-meta .badge{background:var(--red);color:#fff;padding:3px 10px;border-radius:4px;font-size:.75rem;font-weight:700}
.hero-meta .rating{color:#46d369;font-weight:700;font-size:.9rem}
.hero-meta .year,.hero-meta .size{color:var(--gray);font-size:.85rem}
.hero-overview{font-size:.95rem;line-height:1.55;color:#ccc;margin-bottom:24px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hero-buttons{display:flex;gap:12px;flex-wrap:wrap}
.btn-play{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;border-radius:var(--radius);background:var(--white-b);color:#111;font-size:1rem;font-weight:700;border:none;transition:all var(--t)}
.btn-play:hover{background:#d4d4d4;transform:scale(1.03)}
.btn-info{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;border-radius:var(--radius);background:rgba(109,109,110,.7);color:var(--white-b);font-size:1rem;font-weight:600;border:none;transition:all var(--t)}
.btn-info:hover{background:rgba(109,109,110,.5)}

/* ═══════════════════════════════════════════════════
   CONTINUE WATCHING ROW
   ═══════════════════════════════════════════════════ */
.continue-section{padding:10px 4% 0}
.continue-section .section-title{font-size:1.2rem;font-weight:700;color:var(--white-b);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.continue-row{display:flex;gap:14px;overflow-x:auto;padding-bottom:14px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.continue-row::-webkit-scrollbar{height:4px}
.continue-card{position:relative;flex-shrink:0;width:200px;aspect-ratio:16/9;border-radius:var(--radius);overflow:hidden;cursor:pointer;background:#222;scroll-snap-align:start;transition:transform var(--t),box-shadow var(--t)}
.continue-card:hover,.continue-card.focused{transform:scale(1.06);box-shadow:var(--shadow)}
.continue-card.focused{outline:3px solid var(--red);outline-offset:2px}
.continue-card img{width:100%;height:100%;object-fit:cover}
.continue-card .cc-fallback{display:flex;align-items:center;justify-content:center;width:100%;height:100%;background:linear-gradient(135deg,#1e1e2e,#2a1a1e);font-size:.8rem;font-weight:600;padding:10px;text-align:center}
.continue-card .cc-overlay{position:absolute;bottom:0;left:0;right:0;padding:8px 10px 4px;background:linear-gradient(to top,rgba(0,0,0,.9),transparent)}
.continue-card .cc-title{font-size:.72rem;font-weight:600;color:var(--white-b);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:4px}
.continue-card .progress-track{width:100%;height:3px;background:rgba(255,255,255,.2);border-radius:2px;overflow:hidden}
.continue-card .progress-fill{height:100%;background:var(--red);border-radius:2px;transition:width .3s ease}

/* ═══════════════════════════════════════════════════
   SECTION / GRID
   ═══════════════════════════════════════════════════ */
.section{padding:10px 4% 40px}
.section-title{font-size:1.3rem;font-weight:700;color:var(--white-b);margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}

/* ═══════════════════════════════════════════════════
   CARDS
   ═══════════════════════════════════════════════════ */
.card{position:relative;border-radius:var(--radius);overflow:hidden;cursor:pointer;background:var(--bg-card);transition:transform var(--t),box-shadow var(--t),outline-color .2s ease;aspect-ratio:2/3;outline:3px solid transparent;outline-offset:2px}
.card:hover,.card.focused{transform:scale(1.08);z-index:10;box-shadow:var(--shadow)}
.card.focused{outline-color:var(--red)}
.card img{width:100%;height:100%;object-fit:cover;transition:opacity var(--t)}
.card .card-fallback{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;background:linear-gradient(135deg,#1e1e2e 0%,#2a1a1e 100%);padding:20px;text-align:center}
.card .card-fallback .fallback-icon{font-size:2.6rem;margin-bottom:10px;opacity:.5}
.card .card-fallback .fallback-name{font-size:.85rem;font-weight:600;color:var(--white);line-height:1.3;margin-bottom:6px}
.card .card-fallback .fallback-size{font-size:.7rem;color:var(--gray)}
.card .card-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.85) 0%,transparent 50%);display:flex;flex-direction:column;justify-content:flex-end;padding:14px;opacity:0;transition:opacity var(--t)}
.card:hover .card-overlay,.card.focused .card-overlay{opacity:1}
.card-overlay .card-title{font-size:.8rem;font-weight:600;color:var(--white-b);line-height:1.3;margin-bottom:4px}
.card-overlay .card-rating{font-size:.7rem;color:#46d369;font-weight:600}
.card-overlay .card-size{font-size:.66rem;color:var(--gray);margin-top:2px}

/* Card progress bar (for continue watching indicator on grid) */
.card .card-progress{position:absolute;bottom:0;left:0;right:0;height:4px;background:rgba(255,255,255,.15)}
.card .card-progress-fill{height:100%;background:var(--red);transition:width .3s ease}

/* ═══════════════════════════════════════════════════
   PLAYER MODAL
   ═══════════════════════════════════════════════════ */
.modal-backdrop{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .3s ease,visibility .3s ease}
.modal-backdrop.active{opacity:1;visibility:visible}
.modal{position:relative;width:96vw;max-width:1200px;height:90vh;border-radius:12px;background:#111;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.8);transform:scale(.92);transition:transform .35s ease}
.modal-backdrop.active .modal{transform:scale(1)}

.modal-header{display:flex;align-items:center;gap:10px;padding:12px 18px;background:rgba(0,0,0,.6);flex-shrink:0}
.modal-header h2{flex:1;font-size:1rem;font-weight:600;color:var(--white-b);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal-header .modal-btn{padding:6px 14px;border-radius:var(--radius);font-size:.78rem;font-weight:600;border:none;transition:all var(--t);white-space:nowrap}
.btn-download{background:var(--red);color:#fff}.btn-download:hover{background:var(--red-hover)}
.btn-mode{background:rgba(255,255,255,.1);color:var(--white)}.btn-mode:hover{background:rgba(255,255,255,.2)}
.btn-close-modal{background:rgba(255,255,255,.1);color:var(--white)}.btn-close-modal:hover{background:rgba(255,255,255,.2)}

.modal .player-area{flex:1;position:relative;background:#000;display:flex;align-items:center;justify-content:center}
.modal video{width:100%;height:100%;background:#000;outline:none}
.modal iframe{width:100%;height:100%;border:none;background:#000}

/* Shortcut indicator */
.shortcut-indicator{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.8);background:rgba(0,0,0,.75);color:#fff;padding:16px 28px;border-radius:12px;font-size:1.3rem;font-weight:700;pointer-events:none;opacity:0;transition:opacity .15s ease,transform .15s ease;z-index:10;text-align:center;backdrop-filter:blur(8px);display:flex;align-items:center;gap:10px}
.shortcut-indicator.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.shortcut-indicator .si-icon{font-size:1.6rem}

/* ═══════════════════════════════════════════════════
   TMDB KEY MODAL
   ═══════════════════════════════════════════════════ */
.key-modal-backdrop{position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .3s ease,visibility .3s ease}
.key-modal-backdrop.active{opacity:1;visibility:visible}
.key-modal{background:#232323;border-radius:12px;padding:30px;width:90%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.7);transform:translateY(20px);transition:transform .3s ease}
.key-modal-backdrop.active .key-modal{transform:translateY(0)}
.key-modal h3{font-size:1.1rem;font-weight:700;color:var(--white-b);margin-bottom:8px}
.key-modal p{font-size:.8rem;color:var(--gray);line-height:1.5;margin-bottom:18px}
.key-modal input{width:100%;padding:11px 14px;border-radius:var(--radius);border:1px solid #444;background:#1a1a1a;color:var(--white-b);font-size:.88rem;outline:none;transition:border-color var(--t)}
.key-modal input:focus{border-color:var(--red)}
.key-modal .key-actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.key-modal .key-actions button{padding:9px 20px;border-radius:var(--radius);font-size:.82rem;font-weight:600;border:none}
.btn-save-key{background:var(--red);color:#fff}.btn-save-key:hover{background:var(--red-hover)}
.btn-clear-key{background:rgba(255,255,255,.1);color:var(--white)}
.btn-cancel-key{background:transparent;color:var(--gray)}

/* ═══════════════════════════════════════════════════
   LOADER & TOAST
   ═══════════════════════════════════════════════════ */
.loader-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:20px}
.spinner{width:46px;height:46px;border:4px solid #333;border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-text{color:var(--gray);font-size:.88rem}

.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px 20px;text-align:center}
.empty-state .empty-icon{font-size:3rem;margin-bottom:14px;opacity:.4}
.empty-state .empty-text{color:var(--gray);font-size:.92rem}

/* Toast */
.toast-container{position:fixed;top:76px;right:20px;z-index:4000;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 20px;border-radius:var(--radius);background:#222;color:var(--white-b);font-size:.82rem;font-weight:500;box-shadow:0 4px 20px rgba(0,0,0,.5);transform:translateX(120%);transition:transform .3s ease;border-left:3px solid var(--red);max-width:360px}
.toast.show{transform:translateX(0)}
.toast.success{border-left-color:#46d369}

/* ═══════════════════════════════════════════════════
   FOOTER
   ═══════════════════════════════════════════════════ */
footer{padding:40px 4% 30px;text-align:center;border-top:1px solid #222}
footer p{color:#555;font-size:.76rem}

/* ═══════════════════════════════════════════════════
   RESPONSIVE
   ═══════════════════════════════════════════════════ */
@media(max-width:768px){
  .navbar{padding:10px 3%;gap:6px}.logo{font-size:1.15rem}
  .search-wrap.open input{width:140px}
  .hero{min-height:70vh}.hero-content{padding:0 4% 4%}.hero-content h1{font-size:1.5rem}
  .grid{grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:12px}
  .modal{width:100vw;height:100vh;border-radius:0}
  .stats-badge{display:none}
  .continue-card{width:160px}
}
@media(max-width:480px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px}
  .nav-btn{padding:4px 8px;font-size:.72rem}
  .continue-card{width:140px}
}
</style>
</head>
<body>

<!-- ═══ NAVBAR ═══ -->
<nav class="navbar" id="navbar">
  <div class="logo">Cine <span>Isaguirre</span></div>
  <div class="nav-spacer"></div>
  <div class="stats-badge" id="statsBadge" style="display:none">
    <span class="stat-item" id="statsMovies"></span>
    <span class="stat-sep">•</span>
    <span class="stat-item" id="statsStorage"></span>
  </div>
  <div class="search-wrap" id="searchWrap">
    <button class="search-icon" id="searchToggle" title="Buscar (Ctrl+K)">🔍</button>
    <input type="text" id="searchInput" placeholder="Buscar película…" autocomplete="off">
  </div>
  <button class="nav-btn btn-sync" id="btnSync" title="Sincronizar con Drive">
    <span class="sync-icon">🔄</span> Sync
  </button>
  <button class="nav-btn" id="btnTmdb" title="Configurar API Key de TMDB">🔑 TMDB</button>
</nav>

<!-- ═══ HERO ═══ -->
<section class="hero" id="hero">
  <div class="hero-content" id="heroContent" style="display:none">
    <h1 id="heroTitle"></h1>
    <div class="hero-meta">
      <span class="badge">HD</span>
      <span class="rating" id="heroRating"></span>
      <span class="year" id="heroYear"></span>
      <span class="size" id="heroSize"></span>
    </div>
    <p class="hero-overview" id="heroOverview"></p>
    <div class="hero-buttons">
      <button class="btn-play" id="heroPlay">▶ Reproducir ahora</button>
      <button class="btn-info" id="heroInfo">ℹ Más info</button>
    </div>
  </div>
</section>

<!-- ═══ CONTINUE WATCHING ═══ -->
<section class="continue-section" id="continueSection" style="display:none">
  <h2 class="section-title">🕐 Seguir viendo</h2>
  <div class="continue-row" id="continueRow"></div>
</section>

<!-- ═══ GRID ═══ -->
<section class="section" id="catalogSection" style="display:none">
  <h2 class="section-title" id="sectionTitle">Catálogo</h2>
  <div class="grid" id="movieGrid"></div>
</section>

<!-- ═══ LOADER ═══ -->
<div class="loader-wrap" id="loader">
  <div class="spinner"></div>
  <span class="loader-text">Cargando catálogo…</span>
</div>

<!-- ═══ PLAYER MODAL ═══ -->
<div class="modal-backdrop" id="playerModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Película</h2>
      <button class="modal-btn btn-mode" id="modalMode" title="Cambiar modo de reproducción">🎬 HTML5</button>
      <a class="modal-btn btn-download" id="modalDownload" href="#" target="_blank" rel="noopener">⬇ Descargar</a>
      <button class="modal-btn btn-close-modal" id="modalClose">✕ Cerrar</button>
    </div>
    <div class="player-area" id="playerArea">
      <video id="modalVideo" controls preload="metadata"></video>
      <iframe id="modalIframe" src="about:blank" allow="autoplay; fullscreen" allowfullscreen style="display:none"></iframe>
      <div class="shortcut-indicator" id="shortcutInd"><span class="si-icon"></span><span class="si-text"></span></div>
    </div>
  </div>
</div>

<!-- ═══ TMDB KEY MODAL ═══ -->
<div class="key-modal-backdrop" id="keyModal">
  <div class="key-modal">
    <h3>🔑 API Key de TMDB</h3>
    <p>Ingresá tu API Key de <a href="https://www.themoviedb.org/settings/api" target="_blank" style="color:var(--red)">TheMovieDB</a> para obtener pósters, sinopsis y calificaciones.</p>
    <input type="text" id="tmdbKeyInput" placeholder="Ej: 8e4a1c5b3d7f9e2a…" spellcheck="false">
    <div class="key-actions">
      <button class="btn-cancel-key" id="keyCancel">Cancelar</button>
      <button class="btn-clear-key" id="keyClear">Borrar</button>
      <button class="btn-save-key" id="keySave">Guardar</button>
    </div>
  </div>
</div>

<!-- ═══ TOAST ═══ -->
<div class="toast-container" id="toastContainer"></div>

<footer><p>© 2026 Cine Isaguirre — Streaming Personal</p></footer>

<!-- ═══════════════════════════════════════════════════
     JAVASCRIPT
     ═══════════════════════════════════════════════════ -->
<script>
(()=>{
'use strict';

/* ═══════════════════════════════════════════════════
   CONFIG
   ═══════════════════════════════════════════════════ */
const DATA_URL    = 'https://script.google.com/macros/s/AKfycbxCUBr_pWiLxv8mOR0mitzA9ymIOzC04nUw_p9uHVdVuEF5K2hUQDMdIovrEXIkC5ao/exec';
const TMDB_API_KEY = '7e567a32e540f7d44a84e821d0ccd68b';
const TMDB_IMG    = 'https://image.tmdb.org/t/p/';
const PROGRESS_PREFIX = 'cinei_prog_';
const SAVE_INTERVAL   = 5000; // ms

/* ═══════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════ */
let movies       = [];
let stats        = null;
let tmdbCache    = {};
let heroMovie    = null;
let currentMovie = null;
let playerMode   = 'html5'; // 'html5' | 'embed'
let playerOpen   = false;
let progressTimer= null;
let focusIndex   = -1;
let focusPool    = [];    // current list of focusable card elements
let gpPrev       = {};    // previous gamepad button states

/* ═══════════════════════════════════════════════════
   DOM
   ═══════════════════════════════════════════════════ */
const $ = s => document.querySelector(s);
const navbar       = $('#navbar');
const hero         = $('#hero');
const heroContent  = $('#heroContent');
const heroTitle    = $('#heroTitle');
const heroRating   = $('#heroRating');
const heroYear     = $('#heroYear');
const heroSize     = $('#heroSize');
const heroOverview = $('#heroOverview');
const heroPlay     = $('#heroPlay');
const heroInfo     = $('#heroInfo');
const continueSection = $('#continueSection');
const continueRow  = $('#continueRow');
const catalogSection  = $('#catalogSection');
const movieGrid    = $('#movieGrid');
const loader       = $('#loader');
const sectionTitle = $('#sectionTitle');
const searchWrap   = $('#searchWrap');
const searchToggle = $('#searchToggle');
const searchInput  = $('#searchInput');
const statsBadge   = $('#statsBadge');
const statsMovies  = $('#statsMovies');
const statsStorage = $('#statsStorage');
const btnSync      = $('#btnSync');
const btnTmdb      = $('#btnTmdb');
const playerModal  = $('#playerModal');
const modalTitle   = $('#modalTitle');

/* ═══════════════════════════════════════════════════
   HELPERS
   ═══════════════════════════════════════════════════ */
function getApiKey(){return localStorage.getItem('tmdb_api_key')||TMDB_API_KEY||''}

function cleanName(fileName){
  if(!fileName)return 'Sin título';
  let n=fileName;
  n=n.replace(/\.(mp4|mkv|avi|mov|wmv|flv|webm|m4v|ts|mpg|mpeg|3gp)$/i,'');
  n=n.replace(/\b(2160|1080|720|480|360)[pPiI]\b/g,'');
  n=n.replace(/\b(HDRip|BRRip|BDRip|BluRay|WEB-?DL|WEB-?Rip|HDTV|DVDRip|CAMRip|TS|HC|HEVC|x264|x265|H\.?264|H\.?265|AAC|AC3|DTS|DUAL|LATINO|CASTELLANO|ESPAÑOL|MULTI|REMUX|AMZN|NF|DSNP|HMAX|APTCH)\b/gi,'');
  n=n.replace(/[\[\(].*?[\]\)]/g,'');
  n=n.replace(/\b(19|20)\d{2}\b/g,'');
  n=n.replace(/[._\-]+/g,' ');
  n=n.replace(/\s{2,}/g,' ').trim();
  return n||'Sin título';
}

function formatSize(mb){
  if(!mb)return '';
  return mb>=1024?(mb/1024).toFixed(1)+' GB':Math.round(mb)+' MB';
}

function toast(msg, type='info', duration=3500){
  const t=document.createElement('div');
  t.className='toast'+(type==='success'?' success':'');
  t.textContent=msg;
  toastContainer.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),350)},duration);
}

/* ═══════════════════════════════════════════════════
   PROGRESS TRACKING (localStorage)
   ═══════════════════════════════════════════════════ */
function saveProgress(id, currentTime, duration){
  if(!id||!duration||duration<1)return;
  const pct=currentTime/duration;
  if(pct<0.01){localStorage.removeItem(PROGRESS_PREFIX+id);return}
  if(pct>0.95){localStorage.removeItem(PROGRESS_PREFIX+id);return}
  localStorage.setItem(PROGRESS_PREFIX+id,JSON.stringify({t:currentTime,d:duration,ts:Date.now()}));
}

function getProgress(id){
  try{const d=localStorage.getItem(PROGRESS_PREFIX+id);return d?JSON.parse(d):null}catch{return null}
}

function getAllProgress(){
  const out={};
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k.startsWith(PROGRESS_PREFIX)){
      try{out[k.slice(PROGRESS_PREFIX.length)]=JSON.parse(localStorage.getItem(k))}catch{}
    }
  }
  return out;
}

function getContinueWatching(){
  const prog=getAllProgress();
  return movies.filter(m=>{
    const p=prog[m.id];
    if(!p)return false;
    const pct=p.t/p.d;
    return pct>=0.01&&pct<=0.95;
  }).sort((a,b)=>{
    const pa=prog[a.id],pb=prog[b.id];
    return(pb?.ts||0)-(pa?.ts||0);
  });
}

/* ═══════════════════════════════════════════════════
   TMDB
   ═══════════════════════════════════════════════════ */
async function fetchTmdb(query){
  const key=getApiKey();
  if(!key)return null;
  if(tmdbCache[query])return tmdbCache[query];
  try{
    const res=await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${encodeURIComponent(key)}&query=${encodeURIComponent(query)}&language=es-MX`);
    if(!res.ok)return null;
    const data=await res.json();
    const r=data.results&&data.results[0]?data.results[0]:null;
    tmdbCache[query]=r;return r;
  }catch{return null}
}

/* ═══════════════════════════════════════════════════
   RENDER: STATS
   ═══════════════════════════════════════════════════ */
function renderStats(){
  if(!stats){statsBadge.style.display='none';return}
  statsMovies.textContent=`🎬 ${stats.totalMovies||movies.length} pelis`;
  const used=stats.folderUsedGB!=null?stats.folderUsedGB.toFixed(1):'?';
  const free=stats.driveFreeGB!=null?stats.driveFreeGB.toFixed(1):'?';
  statsStorage.textContent=`💾 ${used} GB usados / ${free} GB libres`;
  statsBadge.style.display='';
}

/* ═══════════════════════════════════════════════════
   RENDER: CONTINUE WATCHING
   ═══════════════════════════════════════════════════ */
function renderContinue(){
  const list=getContinueWatching();
  if(list.length===0){continueSection.style.display='none';return}
  continueSection.style.display='';
  continueRow.innerHTML='';
  const frag=document.createDocumentFragment();
  list.forEach(m=>{
    const prog=getProgress(m.id);
    const pct=prog?Math.round((prog.t/prog.d)*100):0;
    const tmdb=m._tmdb;
    const name=tmdb?.title||m._clean;
    const div=document.createElement('div');
    div.className='continue-card';
    div.tabIndex=0;
    div.dataset.id=m.id;

    let imgHtml='';
    if(tmdb&&tmdb.backdrop_path){
      imgHtml=`<img src="${TMDB_IMG}w500${tmdb.backdrop_path}" alt="${name}" loading="lazy">`;
    }else if(tmdb&&tmdb.poster_path){
      imgHtml=`<img src="${TMDB_IMG}w500${tmdb.poster_path}" alt="${name}" loading="lazy">`;
    }else{
      imgHtml=`<div class="cc-fallback">${name}</div>`;
    }
    div.innerHTML=`${imgHtml}<div class="cc-overlay"><div class="cc-title">${name}</div><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div></div>`;
    div.addEventListener('click',()=>openPlayer(m));
    frag.appendChild(div);
  });
  continueRow.appendChild(frag);
}

/* ═══════════════════════════════════════════════════
   RENDER: CARDS & GRID
   ═══════════════════════════════════════════════════ */
function createCard(movie){
  const div=document.createElement('div');
  div.className='card';
  div.tabIndex=0;
  div.dataset.id=movie.id;
  const tmdb=movie._tmdb;
  const name=movie._clean;
  const size=formatSize(movie.sizeMB);
  const prog=getProgress(movie.id);
  let progHtml='';
  if(prog){const pct=Math.round((prog.t/prog.d)*100);progHtml=`<div class="card-progress"><div class="card-progress-fill" style="width:${pct}%"></div></div>`;}

  if(tmdb&&tmdb.poster_path){
    div.innerHTML=`
      <img src="${TMDB_IMG}w500${tmdb.poster_path}" alt="${name}" loading="lazy"
           onerror="this.nextElementSibling.style.display='flex';this.style.display='none'">
      <div class="card-fallback" style="display:none"><span class="fallback-icon">🎬</span><span class="fallback-name">${name}</span><span class="fallback-size">${size}</span></div>
      <div class="card-overlay"><span class="card-title">${tmdb.title||name}</span>${tmdb.vote_average?`<span class="card-rating">⭐ ${tmdb.vote_average.toFixed(1)}</span>`:''}<span class="card-size">${size}</span></div>${progHtml}`;
  }else{
    div.innerHTML=`<div class="card-fallback"><span class="fallback-icon">🎬</span><span class="fallback-name">${name}</span><span class="fallback-size">${size}</span></div>${progHtml}`;
  }
  div.addEventListener('click',()=>openPlayer(movie));
  return div;
}

function renderGrid(list){
  movieGrid.innerHTML='';
  if(list.length===0){movieGrid.innerHTML=`<div class="empty-state" style="grid-column:1/-1"><span class="empty-icon">🔍</span><span class="empty-text">No se encontraron películas</span></div>`;return}
  const frag=document.createDocumentFragment();
  list.forEach(m=>frag.appendChild(createCard(m)));
  movieGrid.appendChild(frag);
  updateFocusPool();
}

/* ═══════════════════════════════════════════════════
   PLAYER
   ═══════════════════════════════════════════════════ */
function openPlayer(movie){
  currentMovie=movie;playerOpen=true;
  const name=movie._tmdb?.title||movie._clean;
  modalTitle.textContent=name;
  modalDownload.href=movie.streamUrl||'#';
  playerMode='html5';
  applyPlayerMode(movie);
  playerModal.classList.add('active');
  document.body.style.overflow='hidden';

  // Resume progress
  const prog=getProgress(movie.id);
  if(prog&&prog.t>0){
    modalVideo.addEventListener('loadedmetadata',function resume(){
      modalVideo.currentTime=prog.t;
      modalVideo.removeEventListener('loadedmetadata',resume);
    });
  }

  // Auto-save progress every 5s
  clearInterval(progressTimer);
  progressTimer=setInterval(()=>{
    if(playerMode==='html5'&&modalVideo.duration){
      saveProgress(movie.id,modalVideo.currentTime,modalVideo.duration);
    }
  },SAVE_INTERVAL);
}

function applyPlayerMode(movie){
  if(playerMode==='html5'){
    modalVideo.style.display='';modalIframe.style.display='none';
    modalIframe.src='about:blank';
    modalVideo.src=movie.streamUrl||'';
    modalMode.textContent='📺 Embed';
    // Error fallback
    modalVideo.onerror=()=>{
      toast('Video HTML5 no disponible, cambiando a Embed…');
      playerMode='embed';applyPlayerMode(movie);
    };
  }else{
    modalVideo.style.display='none';modalIframe.style.display='';
    modalVideo.pause();modalVideo.removeAttribute('src');modalVideo.load();
    modalIframe.src=movie.embedUrl||'about:blank';
    modalMode.textContent='🎬 HTML5';
  }
}

function closePlayer(){
  // Final save
  if(currentMovie&&playerMode==='html5'&&modalVideo.duration){
    saveProgress(currentMovie.id,modalVideo.currentTime,modalVideo.duration);
  }
  clearInterval(progressTimer);
  playerOpen=false;currentMovie=null;
  playerModal.classList.remove('active');
  modalVideo.pause();modalVideo.removeAttribute('src');modalVideo.load();
  modalIframe.src='about:blank';
  document.body.style.overflow='';
  renderContinue();
  renderGrid(getFilteredMovies());
}

modalMode.addEventListener('click',()=>{
  if(!currentMovie)return;
  playerMode=playerMode==='html5'?'embed':'html5';
  applyPlayerMode(currentMovie);
});
modalClose.addEventListener('click',closePlayer);
playerModal.addEventListener('click',e=>{if(e.target===playerModal)closePlayer()});

/* ═══════════════════════════════════════════════════
   KEYBOARD SHORTCUTS
   ═══════════════════════════════════════════════════ */
document.addEventListener('keydown',e=>{
  // Escape
  if(e.key==='Escape'){
    if(keyModal.classList.contains('active')){keyModal.classList.remove('active');return}
    if(playerOpen){closePlayer();return}
  }

  // Ctrl+K = focus search
  if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();searchWrap.classList.add('open');searchInput.focus();return}

  // Player shortcuts (only html5 mode)
  if(playerOpen&&playerMode==='html5'){
    const v=modalVideo;
    switch(e.key){
      case' ':e.preventDefault();if(v.paused){v.play();showIndicator('▶','Play')}else{v.pause();showIndicator('⏸','Pausa')};break;
      case'f':case'F':e.preventDefault();if(!document.fullscreenElement){playerArea.requestFullscreen?.();showIndicator('⛶','Pantalla completa')}else{document.exitFullscreen?.();showIndicator('⊡','Salir fullscreen')};break;
      case'm':case'M':v.muted=!v.muted;showIndicator(v.muted?'🔇':'🔊',v.muted?'Silenciado':'Sonido');break;
      case'ArrowLeft':e.preventDefault();v.currentTime=Math.max(0,v.currentTime-10);showIndicator('⏪','−10s');break;
      case'ArrowRight':e.preventDefault();v.currentTime=Math.min(v.duration||0,v.currentTime+10);showIndicator('⏩','+10s');break;
    }
    return;
  }

  // Spatial navigation (when player is NOT open and not typing)
  if(e.target.tagName==='INPUT')return;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter',' '].includes(e.key)){
    e.preventDefault();
    navigateSpatial(e.key);
  }
});

/* ═══════════════════════════════════════════════════
   SPATIAL NAVIGATION
   ═══════════════════════════════════════════════════ */
function updateFocusPool(){
  focusPool=Array.from(document.querySelectorAll('.continue-card,.card'));
  if(focusIndex>=focusPool.length)focusIndex=focusPool.length-1;
}

function setFocusAt(idx){
  if(idx<0||idx>=focusPool.length)return;
  focusPool.forEach(el=>el.classList.remove('focused'));
  focusIndex=idx;
  focusPool[idx].classList.add('focused');
  focusPool[idx].scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'});
}

function navigateSpatial(key){
  updateFocusPool();
  if(focusPool.length===0)return;
  if(focusIndex<0){setFocusAt(0);return}

  // Calculate grid columns
  const gridCards=Array.from(movieGrid.querySelectorAll('.card'));
  let cols=1;
  if(gridCards.length>=2){
    const r0=gridCards[0].getBoundingClientRect();
    const r1=gridCards[1].getBoundingClientRect();
    if(Math.abs(r0.top-r1.top)<5){
      // same row, count how many share that top
      cols=gridCards.filter(c=>Math.abs(c.getBoundingClientRect().top-r0.top)<5).length;
    }
  }

  const contCards=continueRow.querySelectorAll('.continue-card').length;
  const inContinue=focusIndex<contCards;
  const gridStart=contCards;

  switch(key){
    case'ArrowRight':setFocusAt(Math.min(focusIndex+1,focusPool.length-1));break;
    case'ArrowLeft':setFocusAt(Math.max(focusIndex-1,0));break;
    case'ArrowDown':
      if(inContinue){setFocusAt(gridStart)}
      else{setFocusAt(Math.min(focusIndex+cols,focusPool.length-1))}
      break;
    case'ArrowUp':
      if(!inContinue&&focusIndex-cols<gridStart&&contCards>0){setFocusAt(0)}
      else{setFocusAt(Math.max(focusIndex-cols,0))}
      break;
    case'Enter':case' ':
      focusPool[focusIndex]?.click();
      break;
  }
}

/* ═══════════════════════════════════════════════════
   GAMEPAD API
   ═══════════════════════════════════════════════════ */
const GP_THRESHOLD=0.5;
const GP_REPEAT_MS=200;
let gpLastNav=0;

function pollGamepad(){
  const gps=navigator.getGamepads?navigator.getGamepads():[];
  for(let i=0;i<gps.length;i++){
    const gp=gps[i];
    if(!gp||!gp.connected)continue;
    const now=performance.now();
    const canNav=now-gpLastNav>GP_REPEAT_MS;
    const id=gp.index;
    if(!gpPrev[id])gpPrev[id]={};

    // Helper: detect button press (not held)
    const pressed=(btnIdx)=>{
      const cur=gp.buttons[btnIdx]&&gp.buttons[btnIdx].pressed;
      const prev=gpPrev[id][btnIdx]||false;
      gpPrev[id][btnIdx]=cur;
      return cur&&!prev;
    };

    // A button (0) = Enter / Play-Pause
    if(pressed(0)){
      if(playerOpen&&playerMode==='html5'){
        const v=modalVideo;
        if(v.paused){v.play();showIndicator('▶','Play')}else{v.pause();showIndicator('⏸','Pausa')}
      }else{navigateSpatial('Enter')}
    }

    // B button (1) = Escape / Back
    if(pressed(1)){
      if(playerOpen)closePlayer();
    }

    // X button (2) = seek back
    if(pressed(2)&&playerOpen&&playerMode==='html5'){
      modalVideo.currentTime=Math.max(0,modalVideo.currentTime-10);showIndicator('⏪','−10s');
    }
    // Y button (3) = seek forward
    if(pressed(3)&&playerOpen&&playerMode==='html5'){
      modalVideo.currentTime=Math.min(modalVideo.duration||0,modalVideo.currentTime+10);showIndicator('⏩','+10s');
    }

    // Start (9) = fullscreen
    if(pressed(9)&&playerOpen){
      if(!document.fullscreenElement)playerArea.requestFullscreen?.();
      else document.exitFullscreen?.();
    }

    // D-pad navigation
    if(canNav&&!playerOpen){
      let navKey=null;
      // D-pad buttons
      if(gp.buttons[12]&&gp.buttons[12].pressed)navKey='ArrowUp';
      else if(gp.buttons[13]&&gp.buttons[13].pressed)navKey='ArrowDown';
      else if(gp.buttons[14]&&gp.buttons[14].pressed)navKey='ArrowLeft';
      else if(gp.buttons[15]&&gp.buttons[15].pressed)navKey='ArrowRight';
      // Left stick
      if(!navKey&&gp.axes){
        if(gp.axes[1]<-GP_THRESHOLD)navKey='ArrowUp';
        else if(gp.axes[1]>GP_THRESHOLD)navKey='ArrowDown';
        else if(gp.axes[0]<-GP_THRESHOLD)navKey='ArrowLeft';
        else if(gp.axes[0]>GP_THRESHOLD)navKey='ArrowRight';
      }
      if(navKey){navigateSpatial(navKey);gpLastNav=now}
    }

    // D-pad in player = seek
    if(canNav&&playerOpen&&playerMode==='html5'){
      let seek=0;
      if((gp.buttons[14]&&gp.buttons[14].pressed)||(gp.axes&&gp.axes[0]<-GP_THRESHOLD))seek=-10;
      if((gp.buttons[15]&&gp.buttons[15].pressed)||(gp.axes&&gp.axes[0]>GP_THRESHOLD))seek=10;
      if(seek!==0){
        modalVideo.currentTime=Math.max(0,Math.min(modalVideo.duration||0,modalVideo.currentTime+seek));
        showIndicator(seek<0?'⏪':'⏩',`${seek>0?'+':''}${seek}s`);
        gpLastNav=now;
      }
    }

    // Update all button states for hold detection
    for(let b=0;b<gp.buttons.length;b++){
      gpPrev[id][b]=gp.buttons[b]&&gp.buttons[b].pressed;
    }

    break; // process first connected gamepad only
  }
  requestAnimationFrame(pollGamepad);
}

  });
}

  const filtered=q?getFilteredMovies():movies;

/* ═══════════════════════════════════════════════════
   DATA PARSING & INIT
   ═══════════════════════════════════════════════════ */
function parseData(data){
  if(Array.isArray(data)){
    movies=data;stats=null;
  }else{
    stats=data.stats||null;
    movies=data.movies||data.data||[];
  }
  movies.forEach(m=>{m._clean=cleanName(m.fileName||m.name||'')});
}

async function enrichTmdb(){
  const key=getApiKey();
  if(key){
    btnTmdb.classList.add('active');
    for(let i=0;i<movies.length;i+=5){
      const batch=movies.slice(i,i+5);
      await Promise.all(batch.map(async m=>{m._tmdb=await fetchTmdb(m._clean)}));
    }
  }else{
    btnTmdb.classList.remove('active');
    movies.forEach(m=>{m._tmdb=null});
  }
}

function renderAll(){
  renderStats();
  renderContinue();
  if(movies.length>0)setHero(movies[Math.floor(Math.random()*movies.length)]);
  renderGrid(getFilteredMovies());
  updateFocusPool();
}

async function init(){
  loader.style.display='';catalogSection.style.display='none';heroContent.style.display='none';continueSection.style.display='none';
  try{
    const res=await fetch(DATA_URL);
    const data=await res.json();
    parseData(data);
  }catch{
    loader.innerHTML=`<div class="empty-state"><span class="empty-icon">⚠️</span><span class="empty-text">Error al cargar el catálogo. Reintentá más tarde.</span></div>`;
    return;
  }
  await enrichTmdb();
  loader.style.display='none';
  catalogSection.style.display='';
  renderAll();
}

/* ═══════════════════════════════════════════════════
   PWA: SERVICE WORKER REGISTRATION
   ═══════════════════════════════════════════════════ */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

init();
})();
</script>
